<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>ox_target – UI Preview</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/css/all.min.css" />
    <link href="style.css" rel="stylesheet" type="text/css" />
    <style>
      body { background: #1a1a2e; visibility: visible !important; }
      #preview-controls {
        position: fixed;
        bottom: 16px;
        right: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 9999;
        font-family: sans-serif;
      }
      #preview-controls button {
        padding: 8px 14px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        background: #2563eb;
        color: white;
      }
      #preview-controls button:hover { background: #1d4ed8; }
      #preview-controls button.red { background: #dc2626; }
      #preview-controls button.red:hover { background: #b91c1c; }
    </style>
  </head>
  <body>
    <div id="eye">
      <svg id="eyeSvg" xmlns="http://www.w3.org/2000/svg" height="36px" viewBox="0 0 24 24" width="36px" fill="#000000">
        <path d="M0 0h24v24H0V0z" fill="none"/>
        <path d="M12 4C7 4 2.73 7.11 1 11.5 2.73 15.89 7 19 12 19s9.27-3.11 11-7.5C21.27 7.11 17 4 12 4zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
      </svg>
    </div>
    <div id="options-wrapper"></div>

    <div id="preview-controls">
      <button onclick="showTarget()">Simulovat cíl</button>
      <button onclick="showTargetZones()">Cíl + zóny</button>
      <button onclick="clearOptions()">Opustit cíl</button>
    </div>

    <script>
      const eye = document.getElementById("eyeSvg");
      const wrapper = document.getElementById("options-wrapper");

      function createOption(icon, label, iconColor) {
        const div = document.createElement("div");
        div.className = "option-container";
        div.innerHTML = `<i class="fa-fw ${icon} option-icon"${iconColor ? ` style="color:${iconColor}"` : ""}></i><p class="option-label">${label}</p>`;
        wrapper.appendChild(div);
      }

      function clearOptions() {
        wrapper.innerHTML = "";
        eye.classList.remove("eye-hover");
      }

      function showTarget() {
        clearOptions();
        eye.classList.add("eye-hover");
        createOption("fa-solid fa-hand", "Interact");
        createOption("fa-solid fa-box-open", "Open inventory");
        createOption("fa-solid fa-user", "View profile");
        createOption("fa-solid fa-car", "Enter vehicle");
      }

      function showTargetZones() {
        clearOptions();
        eye.classList.add("eye-hover");
        createOption("fa-solid fa-wrench", "Repair vehicle", "#facc15");
        createOption("fa-solid fa-gas-pump", "Refuel", "#4ade80");
        createOption("fa-solid fa-door-open", "Enter building");
        createOption("fa-solid fa-sign-out-alt", "Exit zone");
      }

      // Auto-load on open
      showTarget();
    </script>
  </body>
</html>
